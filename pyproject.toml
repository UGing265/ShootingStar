[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shootingstar"
version = "0.1.0"
description = "ShootingStar BTCUSDT 30-minute research platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "UGing265" }
]
dependencies = [
    "httpx>=0.27.0",
    "pyarrow>=15.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
shootingstar = "shootingstar.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
