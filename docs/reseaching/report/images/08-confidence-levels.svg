<svg xmlns='http://www.w3.org/2000/svg' width='820' height='290' viewBox='0 0 820 290' font-family='Segoe UI, Arial, sans-serif'><rect width='820' height='290' fill='#FFFFFF'/><text x='20' y='34' font-size='18' fill='#111827' text-anchor='start' font-weight='bold' stroke='#FFFFFF' stroke-width='4' paint-order='stroke'>Mức tự tin Gemini tự khai so với thực tế</text><line x1='200.0' y1='55' x2='200.0' y2='220' stroke='#E5E7EB' stroke-width='1'/><text x='200.0' y='240' font-size='12' fill='#6B7280' text-anchor='middle' font-weight='normal' stroke='#FFFFFF' stroke-width='4' paint-order='stroke'>0%</text><line x1='335.0' y1='55' x2='335.0' y2='220' stroke='#E5E7EB' stroke-width='1'/><text x='335.0' y='240' font-size='12' fill='#6B7280' text-anchor='middle' font-weight='normal' stroke='#FFFFFF' stroke-width='4' paint-order='stroke'>25%</text><line x1='470.0' y1='55' x2='470.0' y2='220' stroke='#E5E7EB' stroke-width='1'/><text x='470.0' y='240' font-size='12' fill='#6B7280' text-anchor='middle' font-weight='normal' stroke='#FFFFFF' stroke-width='4' paint-order='stroke'>50%</text><line x1='605.0' y1='55' x2='605.0' y2='220' stroke='#E5E7EB' stroke-width='1'/><text x='605.0' y='240' font-size='12' fill='#6B7280' text-anchor='middle' font-weight='normal' stroke='#FFFFFF' stroke-width='4' paint-order='stroke'>75%</text><line x1='740.0' y1='55' x2='740.0' y2='220' stroke='#E5E7EB' stroke-width='1'/><text x='740.0' y='240' font-size='12' fill='#6B7280' text-anchor='middle' font-weight='normal' stroke='#FFFFFF' stroke-width='4' paint-order='stroke'>100%</text><line x1='470.0' y1='55' x2='470.0' y2='220' stroke='#111827' stroke-width='2' stroke-dasharray='6 4'/><text x='470.0' y='50' font-size='12' fill='#111827' text-anchor='middle' font-weight='normal' stroke='#FFFFFF' stroke-width='4' paint-order='stroke'>50%</text><rect x='200' y='70' width='216.0' height='30' rx='4' fill='#2563EB'/><text x='188' y='90' font-size='14' fill='#111827' text-anchor='end' font-weight='normal' stroke='#FFFFFF' stroke-width='4' paint-order='stroke'>Gemini nói LOW (15 lần)</text><text x='424.0' y='90' font-size='14' fill='#111827' text-anchor='start' font-weight='normal' stroke='#FFFFFF' stroke-width='4' paint-order='stroke'>đúng 40,0%</text><rect x='200' y='120' width='277.02' height='30' rx='4' fill='#2563EB'/><text x='188' y='140' font-size='14' fill='#111827' text-anchor='end' font-weight='normal' stroke='#FFFFFF' stroke-width='4' paint-order='stroke'>Gemini nói MEDIUM (39 lần)</text><text x='485.02' y='140' font-size='14' fill='#111827' text-anchor='start' font-weight='normal' stroke='#FFFFFF' stroke-width='4' paint-order='stroke'>đúng 51,3%</text><rect x='200' y='170' width='282.96000000000004' height='30' rx='4' fill='#2563EB'/><text x='188' y='190' font-size='14' fill='#111827' text-anchor='end' font-weight='normal' stroke='#FFFFFF' stroke-width='4' paint-order='stroke'>Gemini nói HIGH (21 lần)</text><text x='490.96000000000004' y='190' font-size='14' fill='#111827' text-anchor='start' font-weight='normal' stroke='#FFFFFF' stroke-width='4' paint-order='stroke'>đúng 52,4%</text><text x='20' y='270' font-size='13' fill='#6B7280' text-anchor='start' font-weight='normal' stroke='#FFFFFF' stroke-width='4' paint-order='stroke'>Nếu mức tự tin có giá trị, HIGH phải cao hẳn MEDIUM và LOW. Thực tế HIGH ≈ MEDIUM ≈ 50%.</text></svg>