<svg xmlns='http://www.w3.org/2000/svg' width='820' height='260' viewBox='0 0 820 260' font-family='Segoe UI, Arial, sans-serif'><rect width='820' height='260' fill='#FFFFFF'/><defs><marker id='a' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#6B7280'/></marker></defs><text x='20' y='34' font-size='18' fill='#111827' text-anchor='start' font-weight='bold' stroke='#FFFFFF' stroke-width='4' paint-order='stroke'>Một mốc dự đoán trên trục thời gian</text><rect x='40' y='80' width='520' height='60' rx='8' fill='#DBEAFE' stroke='#93C5FD'/><text x='300' y='107' font-size='15' fill='#111827' text-anchor='middle' font-weight='normal' stroke='#FFFFFF' stroke-width='4' paint-order='stroke'>Quá khứ: 14 ngày nến 1h</text><text x='300' y='127' font-size='13' fill='#6B7280' text-anchor='middle' font-weight='normal' stroke='#FFFFFF' stroke-width='4' paint-order='stroke'>Gemini chỉ được xem phần này</text><rect x='380' y='150' width='180' height='40' rx='8' fill='#EFF6FF' stroke='#93C5FD'/><text x='470' y='175' font-size='13' fill='#111827' text-anchor='middle' font-weight='normal' stroke='#FFFFFF' stroke-width='4' paint-order='stroke'>24 giờ nến 15m</text><rect x='560' y='80' width='220' height='60' rx='8' fill='#F3F4F6' stroke='#E5E7EB' stroke-dasharray='6 4'/><text x='670' y='107' font-size='15' fill='#111827' text-anchor='middle' font-weight='normal' stroke='#FFFFFF' stroke-width='4' paint-order='stroke'>Tương lai: 6 giờ</text><text x='670' y='127' font-size='13' fill='#6B7280' text-anchor='middle' font-weight='normal' stroke='#FFFFFF' stroke-width='4' paint-order='stroke'>bị che, chỉ dùng để chấm</text><line x1='560' y1='60' x2='560' y2='220' stroke='#111827' stroke-width='3'/><text x='560' y='240' font-size='14' fill='#111827' text-anchor='middle' font-weight='bold' stroke='#FFFFFF' stroke-width='4' paint-order='stroke'>t (giá mua P)</text><line x1='780' y1='60' x2='780' y2='220' stroke='#6B7280' stroke-width='2' stroke-dasharray='4 4'/><text x='800' y='240' font-size='14' fill='#111827' text-anchor='end' font-weight='normal' stroke='#FFFFFF' stroke-width='4' paint-order='stroke'>t + 6h (giá thật)</text></svg>