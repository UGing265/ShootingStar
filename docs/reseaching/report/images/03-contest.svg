iddle' font-weight='normal' stroke='#FFFFFF' stroke-width='4' paint-order='stroke'>không nhìn gì</text><text x='310' y='220' font-size='14' fill='#111827' text-anchor='middle' font-weight='normal' stroke='#FFFFFF' stroke-width='4' paint-order='stroke'>đoán TĂNG</text><text x='310' y='330' font-size='15' fill='#6B7280' text-anchor='middle' font-weight='bold' stroke='#FFFFFF' stroke-width='4' paint-order='stroke'>✘ sai</text><line x1='410' y1='86' x2='500' y2='120' stroke='#6B7280' stroke-width='2' marker-end='url(#a)'/><rect x='420' y='122' width='160' height='70' rx='8' fill='#F3F4F6' stroke='#E5E7EB'/><text x='500' y='150' font-size='15' fill='#111827' text-anchor='middle' font-weight='bold' stroke='#FFFFFF' stroke-width='4' paint-order='stroke'>Theo đà 6h</text><text x='500' y='172' font-size='12' fill='#6B7280' text-anchor='middle' font-weight='normal' stroke='#FFFFFF' stroke-width='4' paint-order='stroke'>6h trước tăng → TĂNG</text><text x='500' y='220' font-size='14' fill='#111827' text-anchor='middle' font-weight='normal' stroke='#FFFFFF' stroke-width='4' paint-order='stroke'>đoán TĂNG</text><text x='500' y='330' font-size='15' fill='#6B7280' text-anchor='middle' font-weight='bold' stroke='#FFFFFF' stroke-width='4' paint-order='stroke'>✘ sai</text><line x1='410' y1='86' x2='690' y2='120' stroke='#6B7280' stroke-width='2' marker-end='url(#a)'/><rect x='610' y='122' width='160' height='70' rx='8' fill='#F3F4F6' stroke='#E5E7EB'/><text x='690' y='150' font-size='15' fill='#111827' text-anchor='middle' font-weight='bold' stroke='#FFFFFF' stroke-width='4' paint-order='stroke'>Ngược đà 6h</text><text x='690' y='172' font-size='12' fill='#6B7280' text-anchor='middle' font-weight='normal' stroke='#FFFFFF' stroke-width='4' paint-order='stroke'>6h trước tăng → GIẢM</text><text x='690' y='220' font-size='14' fill='#111827' text-anchor='middle' font-weight='normal' stroke='#FFFFFF' stroke-width='4' paint-order='stroke'>đoán GIẢM</text><text x='690' y='330' font-size='15' 